<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <!-- Tricolor Curved Swoosh Header -->
  <g transform="translate(120, 65) scale(1.1)">
    <!-- Orange Top Curve -->
    <path d="M -70 10 C -40 -35 40 -35 70 10 C 50 -20 -20 -20 -70 10 Z" fill="#FF5722" />
    <!-- Green Middle Curve -->
    <path d="M -65 20 C -35 -15 35 -15 65 20 C 45 -5 -15 -5 -65 20 Z" fill="#4CAF50" />
    <!-- Teal/Blue Bottom Curve -->
    <path d="M -60 30 C -30 -2 30 -2 60 30 C 40 10 -10 10 -60 30 Z" fill="#00BCD4" />
  </g>

  <!-- Massive Bold GST Text -->
  <text x="120" y="162" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="68" fill="#0A2540" text-anchor="middle" letter-spacing="2">GST</text>

  <!-- REGISTERED Subtitle -->
  <text x="120" y="212" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#0A2540" text-anchor="middle" letter-spacing="1">REGISTERED</text>

  <!-- Goods and Services Tax Subtitle -->
  <text x="120" y="246" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#0A2540" text-anchor="middle">Goods and Services Tax</text>
</svg>
