<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <!-- Ashoka Lion Capital Motif -->
  <g transform="translate(120, 85) scale(1.15)">
    <!-- Central Lion Head & Mane -->
    <path d="M 0 -55 C -14 -55 -22 -40 -22 -22 C -22 -6 -14 8 0 8 C 14 8 22 -6 22 -22 C 22 -40 14 -55 0 -55 Z" fill="#0A2540" />
    <path d="M -8 -45 C -4 -48 4 -48 8 -45" stroke="#FFFFFF" stroke-width="1.5" fill="none" />
    
    <!-- Left Lion Profile -->
    <path d="M -18 -42 C -34 -42 -42 -25 -38 -8 C -35 8 -24 14 -12 8 C -15 -8 -13 -30 -18 -42 Z" fill="#0A2540" />
    
    <!-- Right Lion Profile -->
    <path d="M 18 -42 C 34 -42 42 -25 38 -8 C 35 8 24 14 12 8 C 15 -8 13 -30 18 -42 Z" fill="#0A2540" />
    
    <!-- Abacus Base -->
    <rect x="-38" y="10" width="76" height="12" fill="#0A2540" rx="2" />
    
    <!-- Ashoka Chakra (Wheel) in Center -->
    <circle cx="0" cy="16" r="8" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="0" cy="16" r="2" fill="#FFFFFF" />
    <path d="M 0 8 L 0 24 M -8 16 L 8 16 M -6 10 L 6 22 M -6 22 L 6 10" stroke="#FFFFFF" stroke-width="1" />

    <!-- Bull on left, Horse on right -->
    <circle cx="-22" cy="16" r="3" fill="#FFFFFF" />
    <circle cx="22" cy="16" r="3" fill="#FFFFFF" />

    <!-- Pedestal Base -->
    <path d="M -42 22 L 42 22 L 32 34 L -32 34 Z" fill="#0A2540" />
  </g>

  <!-- Satyamev Jayate in Hindi -->
  <text x="120" y="142" font-family="'Noto Sans', 'Arial Unicode MS', Arial, sans-serif" font-weight="700" font-size="12" fill="#0A2540" text-anchor="middle" letter-spacing="0.5">सत्यमेव जयते</text>

  <!-- Main MSME Text -->
  <text x="120" y="186" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="#0A2540" text-anchor="middle" letter-spacing="1">MSME</text>

  <!-- REGISTERED Subtitle -->
  <text x="120" y="222" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#0A2540" text-anchor="middle" letter-spacing="1">REGISTERED</text>

  <!-- Hindi Subtitle -->
  <text x="120" y="252" font-family="'Noto Sans', 'Arial Unicode MS', Arial, sans-serif" font-weight="700" font-size="13" fill="#0A2540" text-anchor="middle">सूक्ष्म, लघु एवं मध्यम उद्यम</text>
</svg>
