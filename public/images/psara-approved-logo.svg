<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="psaraBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#071931" />
    </linearGradient>
    <linearGradient id="psaraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Outer Shield -->
  <path d="M 120 12 L 195 38 C 195 125 160 175 120 198 C 80 175 45 125 45 38 Z" fill="url(#psaraBlue)" stroke="#F59E0B" stroke-width="4" />
  <path d="M 120 22 L 185 45 C 185 118 153 163 120 184 C 87 163 55 118 55 45 Z" fill="none" stroke="#F59E0B" stroke-width="1.5" />

  <!-- Top Star -->
  <polygon points="120,28 123,37 132,37 125,42 128,51 120,46 112,51 115,42 108,37 117,37" fill="#F59E0B" />

  <!-- Laurel Wreath in Shield -->
  <path d="M 75 130 C 65 95 80 65 98 55 M 165 130 C 175 95 160 65 142 55" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />

  <!-- Ashoka Lions Motif inside shield -->
  <g transform="translate(120, 95) scale(0.9)">
    <path d="M 0 -35 C -10 -35 -14 -24 -14 -12 C -14 0 -9 10 0 10 C 9 10 14 0 14 -12 C 14 -24 10 -35 0 -35 Z" fill="#FDE68A" />
    <path d="M -12 -28 C -22 -28 -28 -16 -25 -5 C -22 6 -15 10 -8 6 C -10 -6 -9 -20 -12 -28 Z" fill="#FDE68A" />
    <path d="M 12 -28 C 22 -28 28 -16 25 -5 C 22 6 15 10 8 6 C 10 -6 9 -20 12 -28 Z" fill="#FDE68A" />
    <!-- Pedestal base -->
    <rect x="-22" y="12" width="44" height="6" fill="#F59E0B" rx="1" />
  </g>

  <!-- PSARA Ribbon at bottom of shield -->
  <path d="M 72 155 L 168 155 L 158 172 L 82 172 Z" fill="#0A2540" stroke="#F59E0B" stroke-width="1.5" />
  <text x="120" y="168" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">PSARA</text>

  <!-- Text below Shield -->
  <text x="120" y="222" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#0A2540" text-anchor="middle" letter-spacing="1">PSARA</text>
  <text x="120" y="248" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="26" fill="#0A2540" text-anchor="middle" letter-spacing="1">APPROVED</text>
  
  <text x="120" y="265" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#1E40AF" text-anchor="middle">(Private Security</text>
  <text x="120" y="277" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#1E40AF" text-anchor="middle">Agency Regulation Act)</text>
</svg>
