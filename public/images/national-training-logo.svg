<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <!-- Outer Wreath & Shield Emblem -->
  <g transform="translate(120, 80) scale(1.15)">
    <!-- Laurel Wreath Around Shield -->
    <path d="M -50 45 C -65 15 -55 -25 -30 -45 M 50 45 C 65 15 55 -25 30 -45" fill="none" stroke="#0A2540" stroke-width="4" stroke-linecap="round" />
    
    <!-- Leaves Left -->
    <path d="M -52 30 C -62 25 -58 10 -45 15" fill="#0A2540" />
    <path d="M -50 0 C -60 -5 -55 -20 -42 -12" fill="#0A2540" />
    <path d="M -38 -25 C -46 -32 -38 -45 -28 -34" fill="#0A2540" />

    <!-- Leaves Right -->
    <path d="M 52 30 C 62 25 58 10 45 15" fill="#0A2540" />
    <path d="M 50 0 C 60 -5 55 -20 42 -12" fill="#0A2540" />
    <path d="M 38 -25 C 46 -32 38 -45 28 -34" fill="#0A2540" />

    <!-- Blue Shield -->
    <path d="M 0 -38 L 36 -22 C 36 24 22 44 0 54 C -22 44 -36 24 -36 -22 Z" fill="#0A2540" stroke="#0A2540" stroke-width="2" />

    <!-- Gold Star at Top of Shield -->
    <polygon points="0,-16 2.5,-9 10,-9 4,-4 6,3 0,-1 -6,3 -4,-4 -10,-9 -2.5,-9" fill="#F59E0B" />

    <!-- Graduation Cap & Open Book Icon inside Shield -->
    <!-- Graduation Cap -->
    <polygon points="0,-32 24,-24 0,-16 -24,-24" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.5" />
    <polygon points="0,-16 12,-20 12,-12 0,-8" fill="#1E40AF" />
    <line x1="18" y1="-22" x2="18" y2="-10" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="18" cy="-8" r="2" fill="#F59E0B" />

    <!-- Open Book -->
    <path d="M -18 8 C -9 4 0 8 0 8 C 0 8 9 4 18 8 L 18 28 C 9 24 0 28 0 28 C 0 28 -9 24 -18 28 Z" fill="#FFFFFF" stroke="#0A2540" stroke-width="1.5" />
    <line x1="0" y1="8" x2="0" y2="28" stroke="#0A2540" stroke-width="1.5" />
  </g>

  <!-- Main Text below Icon -->
  <text x="120" y="172" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#0A2540" text-anchor="middle" letter-spacing="1">NATIONAL</text>
  <text x="120" y="206" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#0A2540" text-anchor="middle" letter-spacing="1">TRAINING</text>
  <text x="120" y="240" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="26" fill="#0A2540" text-anchor="middle" letter-spacing="1">CERTIFICATE</text>
</svg>
