<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="badgePsaraNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="badgeSaffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="badgeGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
    <filter id="cardDropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Main Outer Rounded Container Card (White Card) -->
  <rect x="6" y="6" width="588" height="148" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#cardDropShadow)" />

  <!-- Divider Lines -->
  <line x1="200" y1="24" x2="200" y2="136" stroke="#E2E8F0" stroke-width="1.5" />
  <line x1="400" y1="24" x2="400" y2="136" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- SECTION 1: PSARA APPROVED -->
  <g transform="translate(15, 20)">
    <!-- PSARA Shield Icon -->
    <g transform="translate(70, 5)">
      <path d="M 15 2 L 30 9 C 30 28 23 40 15 45 C 7 40 0 28 0 9 Z" fill="url(#badgePsaraNavy)" stroke="url(#badgeGold)" stroke-width="1.5" />
      <!-- Star -->
      <polygon points="15,7 16,11 20,11 17,14 18,18 15,15 12,18 13,14 10,11 14,11" fill="url(#badgeGold)" />
      <!-- Check mark -->
      <path d="M 10 26 L 14 30 L 21 21" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Text -->
    <text x="85" y="68" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="14" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">PSARA</text>
    <text x="85" y="82" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#0284C7" text-anchor="middle" letter-spacing="1">APPROVED</text>
    <text x="85" y="98" font-family="Arial, sans-serif" font-weight="600" font-size="8" fill="#64748B" text-anchor="middle">(Private Security Agency</text>
    <text x="85" y="108" font-family="Arial, sans-serif" font-weight="600" font-size="8" fill="#64748B" text-anchor="middle">Regulation Act)</text>
  </g>

  <!-- SECTION 2: MSME REGISTERED -->
  <g transform="translate(215, 20)">
    <!-- Ashoka Lions / Emblem Icon -->
    <g transform="translate(70, 2)">
      <path d="M 15 0 C 7 0 3 8 3 16 C 3 24 7 30 15 30 C 23 30 27 24 27 16 C 27 8 23 0 15 0 Z" fill="#000080" opacity="0.9" />
      <!-- Ashoka Chakra wheel -->
      <circle cx="15" cy="38" r="5" fill="none" stroke="#000080" stroke-width="1.2" />
      <path d="M 15 33 L 15 43 M 10 38 L 20 38" stroke="#000080" stroke-width="0.8" />
      <rect x="2" y="44" width="26" height="4" fill="url(#badgeGold)" rx="1" />
    </g>

    <!-- Text -->
    <text x="85" y="68" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="14" fill="#000080" text-anchor="middle" letter-spacing="0.5">MSME</text>
    <text x="85" y="82" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#D97706" text-anchor="middle" letter-spacing="1">REGISTERED</text>
    <text x="85" y="98" font-family="Arial, sans-serif" font-weight="600" font-size="8.5" fill="#64748B" text-anchor="middle">Govt. of India</text>
    <text x="85" y="108" font-family="'Noto Sans', Arial, sans-serif" font-weight="600" font-size="8" fill="#64748B" text-anchor="middle">सूक्ष्म, लघु एवं मध्यम उद्यम</text>
  </g>

  <!-- SECTION 3: GST REGISTERED -->
  <g transform="translate(415, 20)">
    <!-- GST Tricolor Icon -->
    <g transform="translate(55, 4)">
      <path d="M 0 12 C 15 0 45 0 60 12 C 50 4 20 4 0 12 Z" fill="url(#badgeSaffron)" />
      <path d="M 2 18 C 16 7 44 7 58 18 C 48 10 21 10 2 18 Z" fill="#E2E8F0" opacity="0.7" />
      <path d="M 4 24 C 18 13 42 13 56 24 C 47 16 22 16 4 24 Z" fill="url(#badgeGreen)" />
    </g>

    <!-- Text -->
    <text x="85" y="68" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#0A2540" text-anchor="middle" letter-spacing="1">GST</text>
    <text x="85" y="82" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#0284C7" text-anchor="middle" letter-spacing="1">REGISTERED</text>
    <text x="85" y="98" font-family="Arial, sans-serif" font-weight="600" font-size="8.5" fill="#64748B" text-anchor="middle">Goods and Services Tax</text>
    <text x="85" y="108" font-family="Arial, sans-serif" font-weight="600" font-size="8" fill="#16A34A" text-anchor="middle">100% Tax Compliant</text>
  </g>
</svg>
